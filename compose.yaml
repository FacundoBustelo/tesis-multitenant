services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tesis

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - tesis

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tesis
      POSTGRES_USER: tesis
      POSTGRES_PASSWORD: tesis_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tesis -d tesis"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tesis

networks:
  tesis:

volumes:
  postgres_data: