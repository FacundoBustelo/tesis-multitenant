name: tesis-benchmark
x-app: &app
  cpus: 2.0
  mem_limit: 1g
  memswap_limit: 1g
  build:
    context: ..
    dockerfile: benchmarks/php.Dockerfile
  environment: &environment
    APP_ENV: benchmark
    APP_DEBUG: 'false'
    APP_KEY: base64:QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=
    APP_CONFIG_CACHE: /tmp/benchmark-config.php
    DB_CONNECTION: pgsql
    DB_URL: ''
    DB_HOST: db
    DB_PORT: '5432'
    DB_DATABASE: benchmark
    DB_USERNAME: bench_runner
    DB_PASSWORD: benchmark_runner_only
    TENANCY_STRATEGY: ${BENCH_STRATEGY:-shared_tables}
    CACHE_STORE: file
    SESSION_DRIVER: file
    LOG_CHANNEL: stderr
    BENCH_MARKER: ${BENCH_MARKER:?Use scripts/bench.py}
  volumes:
    - ./fixtures:/bench/fixtures:ro
    - ./results:/results
    - runtime:/var/www/html/storage
  networks: [experiment]
services:
  app:
    <<: *app
  admin:
    <<: *app
    profiles: [tools]
    environment:
      <<: *environment
      DB_USERNAME: bench_admin
      DB_PASSWORD: benchmark_admin_only
  nginx:
    cpus: 0.5
    mem_limit: 128m
    memswap_limit: 128m
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [experiment]
    depends_on: [app]
  db:
    cpus: 2.0
    mem_limit: 2g
    memswap_limit: 2g
    image: postgres:16
    environment:
      POSTGRES_DB: benchmark
      POSTGRES_USER: bench_admin
      POSTGRES_PASSWORD: benchmark_admin_only
      BENCH_MARKER: ${BENCH_MARKER:?Use scripts/bench.py}
    volumes:
      - database:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/benchmark.sh:ro
    networks: [experiment]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U bench_admin -d benchmark']
      interval: 2s
      retries: 30
  k6:
    cpus: 2.0
    mem_limit: 2g
    memswap_limit: 2g
    image: grafana/k6:1.3.0
    profiles: [tools]
    user: '${BENCH_UID:-1000}:${BENCH_GID:-1000}'
    volumes:
      - ./k6:/scripts:ro
      - ./results:/results
    networks: [experiment]
networks:
  experiment:
    internal: true
volumes:
  database:
  runtime:
